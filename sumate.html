            #sumate-menu-item > a::before {

            #sumate-menu-item:hover .lucho-fuerza-peek { opacity: 1; transform: translateX(-50%) translateY(0); }

    <!-- Audio para el efecto de sable de luz -->
    <audio id="saber-sound" src="assets/img/SONIDO%20SABLE.mp3" preload="none"></audio>

    <script>
        (function() {
            function attachSaberSoundEvents() {
                const sumateMenuItem = document.getElementById('sumate-menu-item');
                const saberSound = document.getElementById('saber-sound');

                if (sumateMenuItem && saberSound) {
                    if (sumateMenuItem.dataset.soundAttached) return;

                    sumateMenuItem.addEventListener('mouseenter', () => {
                        saberSound.volume = 0.8;
                        saberSound.currentTime = 0;
                        saberSound.play().catch(error => {});
                    });

                    sumateMenuItem.addEventListener('mouseleave', () => {
                        saberSound.pause();
                        saberSound.currentTime = 0;
                    });

                    sumateMenuItem.dataset.soundAttached = 'true';
                }
            }

            function setupAudioUnlock() {
                if (window.isFuerzaTacnaAudioUnlocked) return;
                const saberSound = document.getElementById('saber-sound');
                if (saberSound) {
                    const unlocker = () => {
                        saberSound.play().catch(() => {});
                        saberSound.pause();
                    };
                    ['click', 'touchstart', 'keydown'].forEach(evt => {
                        document.addEventListener(evt, unlocker, { once: true });
                    });
                    window.isFuerzaTacnaAudioUnlocked = true;
                }
            }

            function initializePage() {
                setupAudioUnlock();
                attachSaberSoundEvents();
                if (typeof AOS !== 'undefined') AOS.init();
            }

            document.addEventListener('DOMContentLoaded', initializePage);
            
            // Parche para Barba.js: Asegura que el evento de sonido se aplique tras navegar
            setInterval(attachSaberSoundEvents, 500);
        })();
    </script>
